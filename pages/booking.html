
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Your Car | CarRent</title>

    <link rel="stylesheet" href="../css/booking.css">

    <style>
        .rental-type {
            display: flex;
            gap: 24px;
            margin: 10px 0 18px;
        }

        .rental-type label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        #hourlySection,
        #dailySection {
            margin-top: 10px;
        }

        .return-info {
            display: block;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🚗 CarRent</div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="cars.html">Cars</a>
        <a href="history.html">My Bookings</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

        <span id="userArea">
            <a href="login.html" class="loginBtn" id="loginLink">
                Login
            </a>
        </span>
    </nav>
</header>

<section class="booking-container">

    <h1>Book Your Car</h1>

    <form id="bookingForm">

        <label for="fullName">Full Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
        >
        <small id="nameError" class="error"></small>

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >
        <small id="emailError" class="error"></small>

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            maxlength="10"
            minlength="10"
            pattern="[0-9]{10}"
            required
        >
        <small id="phoneError" class="error"></small>

        <label for="car">Select Car</label>
        <select id="car" required>
            <option value="">-- Select Car --</option>
            <option value="Mahindra Thar">Mahindra Thar</option>
            <option value="Hyundai Creta">Hyundai Creta</option>
            <option value="Tata Harrier">Tata Harrier</option>
            <option value="Toyota Fortuner">Toyota Fortuner</option>
            <option value="Maruti Brezza">Maruti Brezza</option>
            <option value="BMW M4 Competition">BMW M4 Competition</option>
        </select>

        <label>Rental Type</label>

        <div class="rental-type">
            <label>
                <input
                    type="radio"
                    name="rentalType"
                    value="hourly"
                    checked
                >
                Hourly
            </label>

            <label>
                <input
                    type="radio"
                    name="rentalType"
                    value="daily"
                >
                Daily
            </label>
        </div>

        <!-- HOURLY BOOKING -->
        <div id="hourlySection">

            <label for="hourlyPickupDate">Pickup Date</label>
            <input
                type="date"
                id="hourlyPickupDate"
                required
            >
            <small id="hourlyPickupError" class="error"></small>

            <label for="pickupTime">Pickup Time</label>
            <input
                type="time"
                id="pickupTime"
                required
            >
            <small id="pickupTimeError" class="error"></small>

            <label for="rentalHours">Rental Hours</label>
            <select id="rentalHours" required>
                <option value="">-- Select Hours --</option>
                <option value="1">1 Hour</option>
                <option value="2">2 Hours</option>
                <option value="3">3 Hours</option>
                <option value="4">4 Hours</option>
                <option value="5">5 Hours</option>
                <option value="6">6 Hours</option>
                <option value="7">7 Hours</option>
                <option value="8">8 Hours</option>
                <option value="9">9 Hours</option>
                <option value="10">10 Hours</option>
                <option value="11">11 Hours</option>
                <option value="12">12 Hours</option>
                <option value="13">13 Hours</option>
                <option value="14">14 Hours</option>
                <option value="15">15 Hours</option>
                <option value="16">16 Hours</option>
                <option value="17">17 Hours</option>
                <option value="18">18 Hours</option>
                <option value="19">19 Hours</option>
                <option value="20">20 Hours</option>
                <option value="21">21 Hours</option>
                <option value="22">22 Hours</option>
                <option value="23">23 Hours</option>
            </select>
            <small id="hoursError" class="error"></small>

            <label for="returnTime">Return Time (Automatic)</label>
            <input
                type="time"
                id="returnTime"
                readonly
            >

            <small id="returnTimeInfo" class="return-info">
                Return time will be calculated automatically.
            </small>

        </div>

        <!-- DAILY BOOKING -->
        <div id="dailySection" style="display: none;">

            <label for="pickupDate">Pickup Date</label>
            <input
                type="date"
                id="pickupDate"
                disabled
            >
            <small id="pickupError" class="error"></small>

            <label for="returnDate">Return Date</label>
            <input
                type="date"
                id="returnDate"
                disabled
            >
            <small id="returnError" class="error"></small>

        </div>

        <label for="pickupLocation">Pickup Location</label>
        <input
            type="text"
            id="pickupLocation"
            placeholder="Enter pickup location"
            required
        >
        <small id="locationError" class="error"></small>

        <!-- PRICE SUMMARY -->
        <div class="price-box">

            <p>
                <strong>Rental Type:</strong>
                <span id="selectedRentalType">Hourly</span>
            </p>

            <p>
                <strong>Rate:</strong>
                <span id="priceRate">₹0 / Hour</span>
            </p>

            <p>
                <strong>Duration:</strong>
                <span id="totalDuration">0</span>
            </p>

            <p>
                <strong>Total Rent:</strong>
                <span id="totalRent">₹0</span>
            </p>

        </div>

        <button type="submit" id="confirmBookingBtn">
            Confirm Booking
        </button>

    </form>

</section>

<script src="../js/booking.js"></script>
<script src="../js/navbar.js"></script>

</body>
</html>
```
