<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | CarRent</title>

    <link rel="stylesheet" href="../css/payment.css">
</head>

<body>

<header>

    <div class="logo">🚗 CarRent</div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="cars.html">Cars</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<section class="payment-container">

    <h1>Complete Your Payment</h1>

    <form id="paymentForm">

        <div class="amount-box">

            <h2>
                Total Amount :
                <span id="paymentAmount">₹0</span>
            </h2>

        </div>

        <h3>Select Payment Method</h3>

        <div class="payment-method">

            <label>
                <input
                    type="radio"
                    name="paymentMethod"
                    value="card"
                    checked
                >
                💳 Card
            </label>

            <label>
                <input
                    type="radio"
                    name="paymentMethod"
                    value="upi"
                >
                📱 UPI
            </label>

            <label>
                <input
                    type="radio"
                    name="paymentMethod"
                    value="cash"
                >
                💵 Cash on Pickup
            </label>

        </div>

        <hr>

        <!-- ================= CARD ================= -->

        <div id="cardSection">

            <label>Card Holder Name</label>

            <input
                type="text"
                id="cardName"
                placeholder="Enter Card Holder Name"
            >

            <label>Card Number</label>

            <input
                type="text"
                id="cardNumber"
                maxlength="16"
                placeholder="1234567812345678"
            >

            <label>Expiry Date</label>

            <input
                type="month"
                id="expiry"
            >

            <label>CVV</label>

            <input
                type="password"
                id="cvv"
                maxlength="3"
                placeholder="123"
            >

        </div>

        <!-- ================= UPI ================= -->

        <div id="upiSection" style="display:none;">

            <h3>UPI Payment</h3>

            <label>Select UPI App</label>

            <select id="upiApp">

                <option>Google Pay</option>
                <option>PhonePe</option>
                <option>Paytm</option>

            </select>

            <label>UPI ID</label>

            <input
                type="text"
                id="upiId"
                placeholder="example@okhdfcbank"
            >

            <p style="text-align:center;">
                OR
            </p>

            <img
    src="../images/myqr.jpeg"
    alt="QR Code"
    width="220"
>

        </div>

        <!-- ================= CASH ================= -->

        <div id="cashSection" style="display:none;">

            <h3>Cash on Pickup</h3>

            <p>
                You can pay cash while collecting your booked car.
            </p>

        </div>
        <br>

        <button type="submit" id="payBtn">
            Pay Now
        </button>

    </form>

</section>

<!-- ================= SUCCESS POPUP ================= -->

<div id="paymentSuccess" class="modal">

    <div class="modal-box">

        <div class="checkmark">✅</div>

        <h2>Payment Successful!</h2>

        <p>
            Your payment has been completed successfully.
        </p>

        <button id="goHome">
            Go To Home
        </button>

    </div>

</div>

<script src="../js/payment.js"></script>

</body>
</html>
